// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Force a single androidx.work version. Transitive deps pull work-runtime-ktx:2.7.1
  // (via androidx datastore) alongside work-runtime:2.8.1 (via react-native-android-widget),
  // and the old ktx artifact still bundles Kotlin extension classes that 2.8.1 also ships,
  // causing a duplicate-class failure. Local build-only fix (this dir is CNG-generated,
  // gitignored, and rebuilt by `expo prebuild`).
  configurations.all {
    resolutionStrategy {
      force 'androidx.work:work-runtime:2.9.0'
      force 'androidx.work:work-runtime-ktx:2.9.0'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
